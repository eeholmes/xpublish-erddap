[build-system]
requires = ["setuptools>=77", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "xpublish-erddap"
description = "ERDDAP-compatible griddap router for Xpublish"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["xarray", "xpublish", "erddap", "griddap", "icechunk", "zarr"]
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [{ name = "Eli Holmes" }]
maintainers = [{ name = "Eli Holmes" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
# Everything `pytest tests` needs, so that none of it skips: erddapy and
# netCDF4 gate the client tests, pooch and netCDF4 fetch the xarray tutorial
# data, uvicorn runs tests/server.py. Keep in step with requirements-dev.txt.
test = ["erddapy", "httpx", "netCDF4", "pooch", "pytest", "pytest-xprocess", "uvicorn"]
demo = ["netCDF4", "pooch", "pydap", "uvicorn"]

[project.urls]
Homepage = "https://github.com/eeholmes/xpublish-erddap"
Source = "https://github.com/eeholmes/xpublish-erddap"
Issues = "https://github.com/eeholmes/xpublish-erddap/issues"
Documentation = "https://github.com/eeholmes/xpublish-erddap/blob/main/docs/hosting.md"

[project.entry-points."xpublish.plugin"]
erddap = "xpublish_erddap.plugin:ErddapPlugin"

[tool.setuptools]
packages = ["xpublish_erddap"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools_scm]
write_to = "xpublish_erddap/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.check-manifest]
ignore = ["xpublish_erddap/_version.py"]

[tool.ruff]
line-length = 100
# claude/ holds session notes and rough scratch tools, not package code.
# force-exclude so pre-commit, which passes filenames explicitly, honours it.
extend-exclude = ["claude"]
force-exclude = true

[tool.ruff.lint]
select = ["A", "B", "C4", "D", "E", "F", "I", "PL", "UP", "W"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/*" = ["D", "PLR2004"]
"demo/*" = ["D", "E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
