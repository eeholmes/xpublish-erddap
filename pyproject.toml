[build-system]
requires = ["setuptools>=61", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "xpublish-erddap"
description = "ERDDAP-compatible griddap router for Xpublish"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["xarray", "xpublish", "erddap", "griddap", "icechunk", "zarr"]
license = { file = "LICENSE.txt" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
test = ["pytest", "httpx", "pandas"]
demo = ["pydap", "uvicorn"]

[project.entry-points."xpublish.plugin"]
erddap = "xpublish_erddap.plugin:ErddapPlugin"

[tool.setuptools]
packages = ["xpublish_erddap"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools_scm]
write_to = "xpublish_erddap/_version.py"

[tool.check-manifest]
ignore = ["xpublish_erddap/_version.py"]

[tool.ruff]
# claude/ holds session notes and rough scratch tools, not package code.
# force-exclude so pre-commit, which passes filenames explicitly, honours it.
extend-exclude = ["claude"]
force-exclude = true

[tool.ruff.lint]
select = ["A", "B", "C4", "D", "E", "F", "I", "PL", "UP", "W"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/*" = ["D", "PLR2004"]
"demo/*" = ["D", "E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
