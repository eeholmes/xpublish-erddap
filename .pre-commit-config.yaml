# Golden files are byte-for-byte captures of real ERDDAP responses.
exclude: ^tests/parity/golden/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-ast
      - id: debug-statements
      - id: end-of-file-fixer
      - id: check-docstring-first
      - id: check-added-large-files
      - id: requirements-txt-fixer
      - id: file-contents-sorter
        files: requirements-dev.txt

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: ^LICENSE.txt$
        # pres: GOBAI-O2's pressure dimension (deploy/)
        args: [--ignore-words-list=pres]

  - repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
      - id: add-trailing-comma

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix, --show-fixes]
      - id: ruff-format

  # Security lint for the GitHub Actions workflows, as in xpublish core and edr.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

# pre-commit.ci (https://pre-commit.ci) runs these hooks on every PR and opens
# a monthly PR bumping their revisions, as for the other xpublish plugins.
ci:
  autofix_prs: false
  autoupdate_schedule: monthly
