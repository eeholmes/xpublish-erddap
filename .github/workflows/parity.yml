name: Parity with live ERDDAP

# Compares xpublish-erddap with real ERDDAP servers (issue #1). Normal CI runs
# the same tests offline against committed captures; this job recaptures from
# the live servers, so it runs on a schedule rather than on every push, and a
# slow NOAA server cannot break a pull request.
on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: TEST
          init-shell: bash
          create-args: >-
            python=3.12 pip
            --file requirements.txt
            --file requirements-dev.txt
            --channel conda-forge

      - name: Install xpublish-erddap
        shell: bash -l {0}
        run: >
          python -m pip install git+https://github.com/xpublish-community/xpublish.git
          && python -m pip install -e . --no-deps --force-reinstall

      - name: Capture from the live servers
        shell: bash -l {0}
        run: |
          python tests/parity/capture.py \
            --out "$RUNNER_TEMP/golden" \
            --compare-to tests/parity/golden \
            | tee "$RUNNER_TEMP/capture.log"
          {
            echo '### Drift from the committed captures'
            echo '```'
            sed -n '/^== drift/,$p' "$RUNNER_TEMP/capture.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Parity tests against the fresh capture
        shell: bash -l {0}
        env:
          PARITY_GOLDEN: ${{ runner.temp }}/golden
        run: python -m pytest -rxs tests/test_parity.py

      - name: Keep the fresh capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-golden
          path: ${{ runner.temp }}/golden
