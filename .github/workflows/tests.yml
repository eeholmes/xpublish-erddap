name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  run:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.11; 3.11 runs in the min-deps job below, at
        # the lowest allowed dependency versions.
        python-version: ["3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          # Windows skips every live-server test, so one job there (and one on
          # macOS), on the newest Python, covers what the OS can change (#112).
          - {os: macos-latest, python-version: "3.14"}
          - {os: windows-latest, python-version: "3.14"}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools_scm needs the tags

      - name: Setup Micromamba ${{ matrix.python-version }}
        uses: mamba-org/setup-micromamba@4b9113af4fba0e9e1124b252dd6497a419e7396d  # v1.11.0
        with:
          environment-name: TEST
          init-shell: bash
          create-args: >-
            python=${{ matrix.python-version }} pip
            --file requirements.txt
            --file requirements-dev.txt
            --channel conda-forge

      - name: Install xpublish-erddap
        shell: bash -l {0}
        run: >
          python -m pip install git+https://github.com/xpublish-community/xpublish.git
          && python -m pip install -e . --no-deps --force-reinstall
          && micromamba info
          && micromamba list

      - name: Tests
        shell: bash -l {0}
        run: |
          python -m pytest -rxs --cov=xpublish_erddap --cov-report=xml tests

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4.6.0

  package:
    # The release workflow builds and checks the package; doing it on every PR
    # finds a broken sdist or README before release day, as xpublish core and
    # xpublish-opendap do.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools_scm needs the tags

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Build and check the package
        run: |
          python -m pip install --upgrade build twine check-manifest
          check-manifest
          python -m build
          twine check --strict dist/*

  min-deps:
    # The matrix above tests the newest releases (and xpublish main). This job
    # tests the floors in requirements.txt: the lowest version of each runtime
    # dependency, on the lowest supported Python. Dev tools are installed
    # normally afterwards; they are not part of what users install.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: "3.11"
          activate-environment: true

      - name: Install the lowest allowed runtime dependencies
        run: |
          uv pip install --resolution lowest-direct -e .
          uv pip install -r requirements-dev.txt
          uv pip list

      - name: Tests
        run: python -m pytest -rxs tests

  erddapy-3-1:
    # The matrix gets the newest erddapy. 3.1.0 discovers a griddap dataset's
    # dimensions through .dds + .csvp, where 3.3 uses .ncml, so an old client
    # exercises different requests (#10). One Python, Linux only; only the
    # test files that import erddapy.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: "3.12"
          activate-environment: true

      - name: Install the dev requirements with erddapy pinned to 3.1.0
        run: |
          uv pip install -e .
          uv pip install -r requirements-dev.txt "erddapy==3.1.0"
          uv pip list

      - name: Show the erddapy version that will run
        run: |
          python -c "import erddapy; print('erddapy', erddapy.__version__)"
          python -c "import erddapy; assert erddapy.__version__ == '3.1.0', erddapy.__version__"

      - name: Tests that use erddapy
        run: python -m pytest -rxs $(grep -rl erddapy tests --include='test_*.py')

  rerddap:
    # The R client is a first-class target for this package, so it is tested
    # too -- but only on Linux, since installing R across the full matrix is
    # disproportionate to the risk.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A normal run takes 2-10 minutes. Without a limit, a hang in setup-r's
    # apt-get update (the runner's Ubuntu mirror not answering, #45) runs for
    # GitHub's 6-hour default.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@4b9113af4fba0e9e1124b252dd6497a419e7396d  # v1.11.0
        with:
          environment-name: TEST
          init-shell: bash
          create-args: >-
            python=3.12 pip
            --file requirements.txt
            --file requirements-dev.txt
            --channel conda-forge

      - name: Install xpublish-erddap
        shell: bash -l {0}
        run: python -m pip install -e . --no-deps --force-reinstall

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          packages: |
            any::rerddap
            any::rerddapXtracto
            any::httr
            any::ncdf4
            any::plotdap

      - name: Run rerddap and the R tutorials against a live server
        shell: bash -l {0}
        # Server and client must share one step: a process backgrounded in an
        # earlier step does not survive the step boundary.
        run: |
          python tests/server.py &
          SERVER=$!
          trap "kill $SERVER" EXIT
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9000/erddap/version >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:9000/erddap/version
          Rscript tests/test_rerddap.R
          Rscript tests/test_tutorials.R
